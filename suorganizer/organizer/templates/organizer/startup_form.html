{% extends parent_template|default:"organizer/base_organizer" %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}
    {{ block.super }} - Create Startup
    {% endblock %}
</head>
<body>
    {% block content %}
    <div>
        <div>
            <form action="{% url 'startup_create' %}" method="post">
                {% csrf_token %}
                {% form.as_p %}
                <button type="submit">Create Startup</button>
            </form>
        </div>
    </div>
    {% endblock %}
</body>
</html>

{% extends parent_template|default:"organizer/base_organizer.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}
    {{ block.super }} - Delete Tag
    {% endblock %}
</head>
<body>
    {% block content %}
    <div>
        <div>
            <form action="{{ tag.get_delete_url }}" method="post">
                {% csrf_token %}
                <p>Are you sure you want to delete tag {{ tag.name }}?</p>
                <a href="{{ tag.get_absolute_url }}">Cancel</a>
                <button type="submit">Delete Tag</button>
            </form>
        </div>
    </div>
    {% endblock %}
</body>
</html>
